<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Token Doctor</title>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
tailwind.config = {
  darkMode: 'media',
  theme: {
    extend: {
      colors: {
        bg: 'var(--bg)', card: 'var(--card)', ink: 'var(--ink)', muted: 'var(--muted)',
        line: 'var(--line)', chip: 'var(--chip)',
        accent: '#d97757', bar: '#6a9bcc', ok: '#788c5d', hot: '#c0453a',
      },
      fontFamily: { heading: ['"Tiempos Headline"', 'Georgia', 'serif'] },
    },
  },
};
</script>
<style>
/* Neutral colors follow the system theme. Tailwind reads them through var(). */
:root { color-scheme: light; --bg: #faf9f5; --card: #ffffff; --ink: #141413; --muted: #73726c; --line: #e8e6dc; --chip: #f0eee6; }
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --bg: #262624; --card: #30302e; --ink: #faf9f5; --muted: #a3a198; --line: #3d3d3a; --chip: #3d3d3a; }
}
.tnum { font-variant-numeric: tabular-nums; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 0.75rem; overflow-wrap: anywhere; }
</style>
<script>window.__REPORT__ = /*REPORT*/null</script>
</head>
<body>
<div id="root"></div>
<script>
const {React, ReactDOM, htm} = window;
const html = htm.bind(React.createElement);
const WEEK_MS = 7 * 24 * 3600e3;
const TABS = [['dashboard', 'Dashboard'], ['leaks', 'Leaks'], ['baseline', 'Baseline'], ['details', 'Details']];
const serving = location.protocol.startsWith('http');

// Formatting helpers. Each one accepts missing values.
const fmt = (n) => {
  n = Number(n);
  if (!isFinite(n)) return '—';
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M';
  if (a >= 1e3) return (n / 1e3).toFixed(a >= 1e4 ? 0 : 1) + 'k';
  return String(Math.round(n));
};
const pct = (x) => {
  const v = (Number(x) || 0) * 100;
  return (v >= 10 ? v.toFixed(0) : v.toFixed(1)) + '%';
};
const sharePct = (s) => (Number(s) || 0).toFixed(1) + '%';
const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');
const cut = (text, n) => ((text || '').length > n ? text.slice(0, n - 1) + '…' : (text || ''));
const toDate = (iso) => new Date(String(iso ?? '').replace(/(\.\d{3})\d+/, '$1'));
const clock = (d) => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
const dayLabel = (d) => d.toLocaleDateString(undefined, {month: 'short', day: 'numeric'});
const stamp = (iso) => (iso && !isNaN(toDate(iso)) ? toDate(iso).toLocaleString() : '—');
const sourceLabel = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const kpiFmt = (kpi, v) => (kpi.unit === '%' ? pct(v) : fmt(v));

// Clipboard API first. A hidden textarea and execCommand are the fallback.
const copyText = (text) => {
  const fallback = () => {
    const el = document.createElement('textarea');
    el.value = text;
    el.style.position = 'fixed';
    el.style.opacity = '0';
    document.body.appendChild(el);
    el.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(el);
  };
  if (navigator.clipboard) navigator.clipboard.writeText(text).catch(fallback);
  else fallback();
};

const CopyButton = ({text, label = 'Copy', className = ''}) => {
  const [done, setDone] = React.useState(false);
  const timer = React.useRef(0);
  const onClick = () => {
    copyText(text || '');
    setDone(true);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setDone(false), 1500);
  };
  return html`<button type="button" onClick=${onClick} class=${className}>${done ? 'Copied' : label}</button>`;
};

// Burn gauge. The needle shows burn.rate on a dial from 0 to 2x goal.
const resetLabel = (iso) => {
  const d = iso ? toDate(iso) : null;
  if (!d || isNaN(d) || d <= Date.now()) return 'that lasts the week';
  return 'that lasts until ' + d.toLocaleDateString(undefined, {weekday: 'short'}) + ' ' + clock(d);
};

const Gauge = ({burn}) => {
  if (!burn?.goal) {
    return html`<div class="py-10 text-center">
      <p class="text-muted">No hourly goal yet</p>
      <p class="text-sm text-muted mt-1">Set --weekly-budget or sign in to Claude Code.</p>
    </div>`;
  }
  const rate = Number(burn.rate) || 0;
  const goal = Number(burn.goal);
  const over = rate > goal;
  const frac = Math.min(1, Math.max(0, rate / (2 * goal)));
  const r = 100, cx = 120, cy = 112;
  const at = (f) => [cx - r * Math.cos(Math.PI * f), cy - r * Math.sin(Math.PI * f)];
  const [x0, y0] = at(0), [xm, ym] = at(0.5), [x1, y1] = at(1), [nx, ny] = at(frac);
  const verdict = over ? `Slow down: ${(rate / goal).toFixed(1)}× the pace ${resetLabel(burn.resets)}` : 'On pace';
  return html`<div class="text-center">
    <svg viewBox="0 0 240 124" class="w-full max-w-[220px] h-auto mx-auto" role="img" aria-label="Burn rate against goal">
      <path d="M${x0} ${y0} A${r} ${r} 0 0 1 ${xm} ${ym}" fill="none" stroke="#788c5d" stroke-width="8" stroke-linecap="round"/>
      <path d="M${xm} ${ym} A${r} ${r} 0 0 1 ${x1} ${y1}" fill="none" stroke="#c0453a" stroke-width="8" stroke-linecap="round"/>
      <line x1=${cx} y1=${cy} x2=${nx} y2=${ny} class="stroke-ink" stroke-width="3" stroke-linecap="round"/>
      <circle cx=${cx} cy=${cy} r="5" class="fill-ink"/>
    </svg>
    <div class="font-heading text-4xl mt-1 ${over ? 'text-hot' : ''}">${fmt(rate)}/h</div>
    <div class="text-sm text-muted">ideal ${fmt(goal)}/h</div>
    <div class="mt-3 text-sm font-medium px-3 py-1.5 rounded-lg inline-block ${over ? 'bg-hot/10 text-hot' : 'bg-ok/10 text-ok'}">${verdict}</div>
    ${burn.basis ? html`<p class="mt-2 text-xs text-muted">${burn.basis}</p>` : null}
  </div>`;
};

const SourceToggle = ({sources, value, onChange}) => html`<div role="group" aria-label="Burn source"
  class="inline-flex p-0.5 rounded-lg bg-chip border border-line">
  ${sources.map(s => html`<button key=${s} type="button" aria-pressed=${s === value} onClick=${() => onChange(s)}
    class="px-3 py-1 text-sm rounded-md ${s === value ? 'bg-card text-ink border border-line' : 'text-muted'}">${sourceLabel(s)}</button>`)}
</div>`;

const ActNow = ({r}) => {
  const acts = r.actions ?? [];
  const urgent = (r.issues ?? []).filter(i => i.priority === 1);
  if (!acts.length && !urgent.length) return html`<p class="text-sm text-muted">Nothing urgent.</p>`;
  return html`<ul class="divide-y divide-line">
    ${acts.map(a => html`<li key=${a} class="flex gap-2 py-2 text-sm"><span class="text-hot">●</span><span>${a}</span></li>`)}
    ${urgent.map(i => html`<li key=${i.title} class="flex items-start gap-3 py-2">
      <div class="min-w-0 flex-1">
        <div class="text-sm font-medium">${i.title}</div>
        <div class="text-xs text-muted mt-0.5">${i.fix}</div>
      </div>
      <${CopyButton} text=${i.prompt} label="Copy fix"
        className="shrink-0 text-xs px-2 py-1 bg-chip rounded border border-line hover:border-accent" />
    </li>`)}
  </ul>`;
};

const ActiveSessions = ({sessions, source}) => {
  // With the source toggle on, show only that source's sessions.
  const rows = source ? sessions.filter(s => s.source === source) : sessions;
  if (!rows.length) {
    const who = source ? sourceLabel(source) + ' ' : '';
    return html`<p class="text-sm text-muted">No ${who}session had a turn in the last 30 minutes.</p>`;
  }
  return html`<div class="overflow-x-auto -mx-2"><table class="w-full min-w-max text-sm">
    <thead><tr class="text-left text-muted">
      <th class="px-2 py-1 font-normal">Session</th><th class="px-2 font-normal">Model</th>
      <th class="px-2 font-normal">Burn rate</th><th class="px-2 font-normal">Burn share</th>
      <th class="px-2 font-normal">Context</th><th class="px-2 font-normal">Age (hours)</th>
      <th class="px-2 font-normal">Idle</th><th class="px-2 font-normal">Flags</th>
    </tr></thead>
    <tbody>${rows.map((s, i) => {
      const share = Number(s.rateShare) || 0;
      const hot = share >= 50;
      return html`<tr key=${i} class="border-t border-line align-top">
        <td class="px-2 py-1">${cut(s.title || '(untitled)', 44)}<div class="text-xs text-muted">${s.project ?? '?'} · ${s.id}</div></td>
        <td class="px-2 py-1">${s.model
          ? html`<span class="px-1.5 py-0.5 rounded text-xs bg-chip text-muted">${s.model.replace(/^claude-/, '')}</span>`
          : '—'}</td>
        <td class="px-2 py-1">${fmt(s.rate)}/h</td>
        <td class="px-2 py-1 ${hot ? 'text-hot' : ''}">${sharePct(share)}
          <div class="mt-1 h-1.5 w-20 rounded bg-line overflow-hidden"><div class="h-full ${hot ? 'bg-hot' : 'bg-bar'}" style=${{width: Math.min(100, Math.max(0, share)) + '%'}}></div></div></td>
        <td class="px-2 py-1">${fmt(s.context)}</td>
        <td class="px-2 py-1">${Number(s.hours || 0).toFixed(1)}h</td>
        <td class="px-2 py-1">${Math.round(s.idle || 0)}m</td>
        <td class="px-2 py-1"><div class="flex flex-wrap gap-1">${(s.flags ?? []).map(f => html`<span key=${f} title=${f}
          class="px-1.5 py-0.5 rounded text-xs bg-hot/10 text-hot cursor-help">${f.split(':')[0]}</span>`)}</div></td>
      </tr>`;
    })}</tbody>
  </table></div>`;
};

const Card = ({title, right, className = '', children}) => html`<section class="card p-4 min-w-0 ${className}">
  ${title || right ? html`<div class="flex items-center justify-between gap-2 mb-3">
    <h2 class="font-heading text-lg">${title}</h2>${right}</div>` : null}
  ${children}
</section>`;

// Small trend line. The dashed line marks the target. Lower is better for every series here.
const Spark = ({values, target}) => {
  if (values.length < 2) return null;
  const w = 100, h = 28, maxV = Math.max(...values, target ?? 0) || 1;
  const x = (i) => (i / (values.length - 1)) * w;
  const y = (v) => h - 2 - (v / maxV) * (h - 4);
  const line = values.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(2)},${y(v).toFixed(2)}`).join(' ');
  return html`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="w-full h-8 mt-2" aria-hidden="true">
    <path d="${line} L${w},${h} L0,${h} Z" fill="#d97757" fill-opacity="0.12"/>
    ${target != null ? html`<line x1="0" x2=${w} y1=${y(target)} y2=${y(target)} class="stroke-muted"
      stroke-dasharray="3 2" vector-effect="non-scaling-stroke"/>` : null}
    <path d=${line} fill="none" stroke="#d97757" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
  </svg>`;
};

// One KPI tile. state: 'hot' needs action now, 'ok' meets the target, null has no target.
const Tile = ({label, value, sub, state, children}) => html`<div class="card p-3 flex flex-col min-w-0 border-t-4
  ${state === 'hot' ? 'border-t-hot' : state === 'ok' ? 'border-t-ok' : 'border-t-line'}">
  <div class="text-xs uppercase tracking-wide text-muted truncate" title=${label}>${label}</div>
  <div class="tnum text-2xl font-semibold mt-1 ${state === 'hot' ? 'text-hot' : ''}">${value}</div>
  <div class="text-xs text-muted truncate" title=${sub}>${sub}</div>
  <div class="mt-auto">${children}</div>
</div>`;

const hoursLabel = (h) => (h >= 48 ? (h / 24).toFixed(1) + ' d' : Math.round(h) + ' h');

// Week used against week elapsed: the bar is usage, the tick is where an even pace would be.
const WeekBar = ({used, elapsed}) => html`<div class="relative mt-3 h-2 rounded bg-line" aria-hidden="true">
  <div class="h-full rounded ${used > elapsed ? 'bg-hot' : 'bg-ok'}" style=${{width: Math.min(100, used) + '%'}}></div>
  <div class="absolute -top-1 h-4 w-0.5 bg-ink" style=${{left: Math.min(100, elapsed) + '%'}}></div>
</div>`;

const KpiStrip = ({r, burn, source}) => {
  const rate = Number(burn?.rate) || 0, goal = Number(burn?.goal) || 0;
  const hourly = (r.timeline ?? []).slice(-24).map(t => (t[1] ?? 0) + (t[2] ?? 0));
  const used = burn?.used, left = burn?.hoursLeft;
  const tiles = [html`<${Tile} key="burn" label="Burn rate, last hour" value=${fmt(rate) + '/h'}
      sub=${goal ? `ideal ${fmt(goal)}/h · ${(rate / goal).toFixed(1)}× pace` : 'no ideal pace yet'}
      state=${goal ? (rate > goal ? 'hot' : 'ok') : null}><${Spark} values=${hourly} target=${goal || null} /></${Tile}>`];
  if (used != null && left != null) {
    const elapsed = 100 * (1 - left / 168);
    // Tokens left at reset: goal is the remaining budget spread over the hours left.
    const dry = rate > 0 ? (goal * left) / rate : Infinity;
    const reset = burn.resets ? toDate(burn.resets) : null;
    const g = burn.gains ?? {};
    const gain = (h, name) => (g[h] == null ? null : `+${Number(g[h]).toFixed(g[h] >= 10 ? 0 : 1)} pts ${name}`);
    const gains = [gain(1, '1 h'), gain(6, '6 h'), gain(24, '24 h')].filter(Boolean).join(' · ');
    tiles.push(html`<${Tile} key="week" label="Weekly limit used" value=${Math.round(used) + '%'}
        sub=${gains || 'no recent spend'} state=${used > elapsed ? 'hot' : 'ok'}>
        <${WeekBar} used=${used} elapsed=${elapsed} />
        <div class="text-xs text-muted mt-1">${Math.round(elapsed)}% of the week gone (tick)</div></${Tile}>`,
      html`<${Tile} key="dry" label="At this burn, runs out in" value=${dry > left ? 'never' : hoursLabel(dry)}
        sub=${'reset in ' + hoursLabel(left) + (reset ? ' · ' + reset.toLocaleDateString(undefined, {weekday: 'short'}) + ' ' + clock(reset) : '')}
        state=${dry > left ? 'ok' : 'hot'} />`);
  } else {
    tiles.push(html`<${Tile} key="week" label="Weekly limit used" value="—"
      sub="no subscription reading yet" state=${null} />`);
  }
  const over = Number(r.over300k) || 0;
  const overHourly = (r.timeline ?? []).slice(-24).map(t => 100 * (t[2] ?? 0) / (((t[1] ?? 0) + (t[2] ?? 0)) || 1));
  tiles.push(html`<${Tile} key="over" label="Spend over 300k context" value=${Math.round(over) + '%'}
    sub=${fmt(r.total) + ' total · ' + (r.days ?? 0) + ' d'} state=${over >= 50 ? 'hot' : 'ok'}>
    <${Spark} values=${overHourly} target=${50} /></${Tile}>`);
  for (const k of r.kpis ?? []) {
    const vals = k.values ?? [], last = vals[vals.length - 1];
    tiles.push(html`<${Tile} key=${k.name} label=${k.name} value=${last == null ? '—' : kpiFmt(k, last)}
      sub=${k.target != null ? 'target ' + kpiFmt(k, k.target) : ''}
      state=${k.target == null || last == null ? null : last > k.target ? 'hot' : 'ok'}>
      <${Spark} values=${vals} target=${k.target ?? null} /></${Tile}>`);
  }
  const active = (r.active ?? []).filter(s => !source || s.source === source);
  const top = active[0];
  tiles.push(html`<${Tile} key="active" label="Active sessions" value=${active.length}
    sub=${top ? `top: ${cut(top.title || top.id, 22)} ${sharePct(top.rateShare)}` : 'none in the last 30 min'}
    state=${top && top.rateShare >= 50 && rate > goal ? 'hot' : null} />`);
  return html`<div class="grid gap-3 grid-cols-2 md:grid-cols-4">${tiles}</div>`;
};

const Dashboard = ({r, burn, sources, source, onSource}) => {
  const toggle = sources.length > 1
    ? html`<${SourceToggle} sources=${sources} value=${source} onChange=${onSource} />` : null;
  return html`<div class="space-y-4">
    <${KpiStrip} r=${r} burn=${burn} source=${sources.length > 1 ? source : null} />
    <div class="grid gap-4 lg:grid-cols-3">
      <${Card} title="Burn, last hour" right=${toggle}><${Gauge} burn=${burn} /></${Card}>
      <${Card} title="Burndown" className="lg:col-span-2">
        <${Burndown} rows=${r.burndown ?? []} budget=${r.budget} benchWindow=${r.benchWindow} />
      </${Card}>
      <${Card} title="Hourly spend by context" className="lg:col-span-2 flex flex-col">
        <${Hourly} rows=${r.timeline ?? []} goal=${burn?.goal} />
      </${Card}>
      <${Card} title="Act now"><${ActNow} r=${r} /></${Card}>
    </div>
    <${Card} title="Active sessions">
      <${ActiveSessions} sessions=${r.active ?? []} source=${sources.length > 1 ? source : null} />
    </${Card}>
  </div>`;
};

const badge = (p) => (p === 1 ? 'bg-hot/10 text-hot' : p === 2 ? 'bg-accent/10 text-accent' : 'bg-chip text-muted');

const LeakRow = ({i}) => {
  const meta = i.share == null ? 'config check' : `${sharePct(i.share)} of spend · ${plural(i.sessions ?? 0, 'session')}`;
  return html`<div class="card p-4">
    <div class="flex flex-wrap items-center gap-2">
      <span class="text-xs font-bold px-2 py-0.5 rounded ${badge(i.priority)}">P${i.priority}</span>
      <span class="font-medium">${i.title}</span>
    </div>
    ${i.share != null ? html`<div class="mt-3 h-2 rounded bg-line overflow-hidden">
      <div class="h-full bg-bar" style=${{width: Math.min(100, Math.max(0, i.share)) + '%'}}></div></div>` : null}
    <p class="text-xs text-muted mt-2">${meta}</p>
    <p class="text-sm mt-2">${i.fix}</p>
    <details class="mt-2 text-xs">
      <summary class="cursor-pointer text-muted">Prompt</summary>
      <pre class="mt-2 p-2 whitespace-pre-wrap break-words bg-bg rounded border border-line">${i.prompt}</pre>
    </details>
    <div class="mt-3"><${CopyButton} text=${i.prompt} label="Copy"
      className="text-xs px-2 py-1 bg-chip rounded hover:bg-accent/10" /></div>
  </div>`;
};

const Leaks = ({issues}) => {
  if (!issues.length) return html`<div class="card p-4"><p class="text-sm text-muted">No leaks detected.</p></div>`;
  const all = issues.map(i => i.prompt).filter(Boolean).join('\n\n');
  return html`<div class="space-y-4">
    <div><${CopyButton} text=${all} label="Copy all fixes for Claude"
      className="text-sm px-3 py-1.5 bg-chip rounded-lg border border-line hover:bg-accent/10" /></div>
    ${issues.map(i => html`<${LeakRow} key=${i.title} i=${i} />`)}
  </div>`;
};

// Cumulative burn over time. Dashed: the same turns with context capped at benchWindow.
// Dotted: a straight line that spends the weekly budget at a steady pace.
const Burndown = ({rows, budget, benchWindow}) => {
  if (!rows.length) return html`<p class="text-sm text-muted">No burndown data.</p>`;
  const t = rows.map(d => toDate(d[0]).getTime());
  const t0 = t[0], n = rows.length - 1, span = Math.max(t[n] - t0, 1);
  const paceEnd = budget ? budget * span / WEEK_MS : 0;
  const maxV = Math.max(paceEnd, ...rows.map(d => Math.max(d[1] ?? 0, d[2] ?? 0))) || 1;
  const w = 640, h = 190, l = 44, rt = 12, b = 22;
  const x = (i) => l + ((t[i] - t0) / span) * (w - l - rt);
  const y = (v) => h - b - (v / maxV) * (h - b - rt);
  const path = (k) => rows.map((d, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(d[k] ?? 0).toFixed(1)}`).join(' ');
  const last = rows[n];
  return html`<div>
    <svg viewBox="0 0 ${w} ${h}" class="w-full h-auto" role="img" aria-label="Cumulative burn">
      <line x1=${l} y1=${h - b} x2=${w - rt} y2=${h - b} class="stroke-line"/>
      <line x1=${l} y1=${rt} x2=${l} y2=${h - b} class="stroke-line"/>
      <text x=${l - 6} y=${rt + 8} text-anchor="end" font-size="10" class="fill-muted">${fmt(maxV)}</text>
      <text x=${l} y=${h - 6} font-size="10" class="fill-muted">${dayLabel(new Date(t0))}</text>
      <text x=${w - rt} y=${h - 6} text-anchor="end" font-size="10" class="fill-muted">${dayLabel(new Date(t[n]))}</text>
      ${budget ? html`<line x1=${x(0)} y1=${y(0)} x2=${x(n)} y2=${y(paceEnd)} class="stroke-muted" stroke-dasharray="1 3" stroke-width="1.5"/>` : null}
      <path d=${path(2)} fill="none" class="stroke-muted" stroke-width="1.5" stroke-dasharray="4 3"/>
      <path d=${path(1)} fill="none" stroke="#d97757" stroke-width="2"/>
    </svg>
    <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs text-muted mt-2">
      <span><span class="inline-block w-4 border-t-2 border-accent align-middle"></span> actual ${fmt(last[1])}</span>
      <span><span class="inline-block w-4 border-t-2 border-dashed border-muted align-middle"></span> benchmark ${fmt(last[2])} (context capped at ${fmt(benchWindow)})</span>
      ${budget ? html`<span><span class="inline-block w-4 border-t-2 border-dotted border-muted align-middle"></span> weekly budget pace</span>` : null}
    </div>
  </div>`;
};

// Hourly spend. Under 300k context at the bottom, over 300k on top.
const Hourly = ({rows, goal}) => {
  if (!rows.length) return html`<p class="text-sm text-muted">No timeline data.</p>`;
  const step = 7, bw = 5, h = 100, base = 100, top = 4;
  const w = rows.length * step;
  const max = Math.max(goal || 0, ...rows.map(t => (t[1] ?? 0) + (t[2] ?? 0))) || 1;
  const scale = (v) => (v / max) * (base - top);
  const hourLabel = (iso) => dayLabel(toDate(iso)) + ' ' + clock(toDate(iso));
  return html`<div class="flex-1 flex flex-col">
    <div class="flex-1 flex flex-col">
      <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="w-full flex-1 min-h-[11rem]" role="img" aria-label="Hourly spend">
        ${rows.map((t, i) => {
          const cool = scale(t[1] ?? 0), hot = scale(t[2] ?? 0), x = i * step + 1;
          return html`<g key=${t[0]}>
            <rect x=${x} y=${base - cool} width=${bw} height=${cool} fill="#6a9bcc" rx="1"/>
            <rect x=${x} y=${base - cool - hot} width=${bw} height=${hot} fill="#c0453a" rx="1"/>
          </g>`;
        })}
        ${goal ? html`<line x1="0" x2=${w} y1=${base - scale(goal)} y2=${base - scale(goal)} stroke="#788c5d"
          stroke-width="1.5" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>` : null}
      </svg>
      <div class="flex justify-between text-xs text-muted border-t border-line pt-1">
        <span>${hourLabel(rows[0][0])}</span><span>max ${fmt(max)}/h</span><span>${hourLabel(rows[rows.length - 1][0])}</span>
      </div>
    </div>
    <div class="flex gap-4 text-xs text-muted mt-2">
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-bar"></span>under 300k context</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-hot"></span>over 300k context</span>
      ${goal ? html`<span class="flex items-center gap-1"><span class="inline-block w-4 border-t-2 border-dashed border-ok"></span>ideal ${fmt(goal)}/h</span>` : null}
    </div>
  </div>`;
};

// Failed checks sort first.
const Baseline = ({rows}) => {
  if (!rows.length) return html`<p class="text-sm text-muted">No baseline checks.</p>`;
  const sorted = [...rows].sort((a, b) => Number(a.ok) - Number(b.ok));
  return html`<div class="card p-2 overflow-x-auto"><table class="w-full text-sm">
    <thead><tr class="text-left text-muted">
      <th class="px-2 py-1 font-normal">Status</th><th class="px-2 font-normal">Check</th>
      <th class="px-2 font-normal">Now</th><th class="px-2 font-normal">Target</th>
    </tr></thead>
    <tbody>${sorted.map(row => html`<tr key=${row.name} class="border-t border-line">
      <td class="px-2 py-1 font-bold ${row.ok ? 'text-ok' : 'text-hot'}">${row.ok ? '✓' : '✗'}</td>
      <td class="px-2 py-1">${row.name}</td>
      <td class="px-2 py-1">${row.now}</td>
      <td class="px-2 py-1 text-muted">${row.target}</td>
    </tr>`)}</tbody>
  </table></div>`;
};

const SimpleTable = ({headers, rows}) => html`<div class="overflow-x-auto"><table class="w-full text-sm">
  <thead><tr>${headers.map(h => html`<th key=${h} class="px-2 py-1 text-left font-normal text-muted">${h}</th>`)}</tr></thead>
  <tbody>${rows.map((row, i) => html`<tr key=${i} class="border-t border-line align-top">
    ${row.map((c, j) => html`<td key=${j} class="px-2 py-1">${c}</td>`)}
  </tr>`)}</tbody>
</table></div>`;

const Block = ({title, headers, rows}) => (rows.length ? html`<section class="card p-4">
  <h3 class="font-heading text-lg mb-2">${title}</h3>
  <${SimpleTable} headers=${headers} rows=${rows} />
</section>` : null);

const Details = ({r}) => {
  const unpriced = r.unpriced ?? null;
  const blocks = [
    {title: 'Top sessions', headers: ['Project', 'ID', 'Title', 'Share', 'Turns', 'Peak', 'Hours'],
     rows: (r.topSessions ?? []).map(s => [s.project ?? '?', s.id ?? '', cut(s.title || s.id, 30), sharePct(s.share),
       s.turns ?? 0, fmt(s.peak), Number(s.hours || 0).toFixed(1) + 'h'])},
    {title: 'Context size buckets', headers: ['Bucket', 'Type', 'Share', 'Turns'],
     rows: (r.buckets ?? []).map(b => [b.label, b.hot ? 'over 300k' : 'under 300k', sharePct(b.share), b.turns ?? 0])},
    {title: 'Projects', headers: ['Project', 'Share'],
     rows: (r.projects ?? []).map(([n, s]) => [n, sharePct(s)])},
    {title: 'Tools', headers: ['Tool', 'Calls'],
     rows: (r.tools ?? []).map(([n, c]) => [n, c])},
    {title: 'Config checks', headers: ['Check'],
     rows: (r.config ?? []).filter(c => c !== 'none').map(c => [c])},
    {title: unpriced ? `Unpriced models (${sharePct(unpriced[0])} of spend)` : 'Unpriced models', headers: ['Model', 'Turns'],
     rows: (unpriced?.[1] ?? []).map(([m, c]) => [m, c])},
  ];
  if (!blocks.some(b => b.rows.length)) return html`<p class="text-sm text-muted">No detail data.</p>`;
  return html`<div class="space-y-6">
    ${blocks.map(b => html`<${Block} key=${b.title} title=${b.title} headers=${b.headers} rows=${b.rows} />`)}
  </div>`;
};

const App = () => {
  const [report, setReport] = React.useState(window.__REPORT__ ?? {});
  const [link, setLink] = React.useState(serving ? 'live' : 'snapshot');
  const [source, setSource] = React.useState('claude');
  const [tab, setTab] = React.useState(location.hash.slice(1));

  React.useEffect(() => {
    const onHash = () => setTab(location.hash.slice(1));
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  // Refresh every 60 s. A failed fetch keeps the old data and shows the offline tag.
  React.useEffect(() => {
    if (!serving) return undefined;
    const load = async () => {
      try {
        const resp = await fetch('/api/report', {cache: 'no-store'});
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        if (data) setReport(data);
        setLink('live');
      } catch (e) {
        setLink('offline');
      }
    };
    load();
    const timer = setInterval(load, 60000);
    return () => clearInterval(timer);
  }, []);

  const burns = report.burns ?? (report.burn ? {claude: report.burn} : {});
  const sources = Object.keys(burns);
  const current = sources.includes(source) ? source : sources[0];
  const tabId = TABS.some(([id]) => id === tab) ? tab : 'dashboard';
  const bodies = {
    dashboard: html`<${Dashboard} r=${report} burn=${burns[current]} sources=${sources} source=${current} onSource=${setSource} />`,
    leaks: html`<${Leaks} issues=${report.issues ?? []} />`,
    baseline: html`<${Baseline} rows=${report.baseline ?? []} />`,
    details: html`<${Details} r=${report} />`,
  };
  const linkClass = link === 'offline' ? 'bg-hot/10 text-hot' : link === 'live' ? 'bg-ok/10 text-ok' : 'bg-chip text-muted';

  return html`<div class="max-w-6xl mx-auto px-4 py-4">
    <header class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-line">
      <div class="flex items-center gap-2"><span class="text-accent text-xl">✻</span><h1 class="font-heading text-xl">Claude Token Doctor</h1></div>
      <div class="flex flex-wrap items-center gap-2 text-sm text-muted">
        <span class="text-xs px-2 py-0.5 rounded ${linkClass}">${link}</span>
        <span>generated ${stamp(report.generated)} · ${report.days ?? 0}-day window</span>
      </div>
    </header>
    <nav class="flex flex-wrap gap-1 border-b border-line">
      ${TABS.map(([id, name]) => html`<a key=${id} href="#${id}"
        class="px-3 py-2 text-sm -mb-px border-b-2 ${id === tabId ? 'border-accent text-ink' : 'border-transparent text-muted hover:text-ink'}">${name}</a>`)}
    </nav>
    <main class="mt-4">${bodies[tabId]}</main>
  </div>`;
};

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
